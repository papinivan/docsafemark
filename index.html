<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocSafeMark</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #fafafa; color: #111; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 600px; width: 100%; background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px 0; letter-spacing: -0.5px; text-align: center; }
        .subtitle { color: #86868b; font-size: 14px; margin: 0 0 32px 0; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 12px; text-transform: uppercase; color: #86868b; margin-bottom: 8px; }
        .dropzone { border: 1px dashed #d2d2d7; padding: 24px; border-radius: 12px; text-align: center; position: relative; cursor: pointer; }
        .dropzone:hover { border-color: #000; background: #fafafa; }
        #imageLoader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; }
        input[type="text"]:focus { outline: none; border-color: #000; }
        .preview-box { border: 1px solid #e5e5ea; border-radius: 12px; background: #f5f5f7; min-height: 150px; display: flex; justify-content: center; align-items: center; margin: 24px 0; overflow: hidden; }
        canvas { max-width: 100%; max-height: 400px; display: none; border-radius: 6px; }
        .btn { width: 100%; background: #111; color: #fff; border: none; padding: 16px; font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer; }
        .btn:disabled { background: #e5e5ea; color: #aeaeae; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="container">
    <h1>DocSafeMark</h1>
    <p class="subtitle">Локальное нанесение защитной маркировки на документы</p>
    <div class="form-group">
        <label>1. Файл документа</label>
        <div class="dropzone">
            <p id="dropText">Перетащите скан или <strong>выберите файл</strong></p>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
    </div>
    <div class="form-group">
        <label>2. Текст водяного знака</label>
        <input type="text" id="textWM" value="Для верификации. Без права кредитования.">
    </div>
    <div class="preview-box">
        <p id="placeText" style="color:#86868b; font-size:13px;">Ожидание загрузки оригинала</p>
        <canvas id="canvasWM"></canvas>
    </div>
    <button class="btn" id="downBtn" disabled>Экспортировать документ</button>
</div>
<script>
    var loader = document.getElementById('imageLoader');
    var textWM = document.getElementById('textWM');
    var canvas = document.getElementById('canvasWM');
    var ctx = canvas.getContext('2d');
    var downBtn = document.getElementById('downBtn');
    var placeText = document.getElementById('placeText');
    var dropText = document.getElementById('dropText');
    var img = null;

    loader.addEventListener('change', function(e) {
        if (!e.target.files[0]) return;
        dropText.innerHTML = 'Файл: <strong>' + e.target.files[0].name + '</strong>';
        var reader = new FileReader();
        reader.onload = function(event) {
            img = new Image();
            img.onload = function() {
                placeText.style.display = 'none';
                canvas.style.display = 'block';
                downBtn.disabled = false;
                draw();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    textWM.addEventListener('input', draw);

    function draw() {
        if (!img) return;
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        var size = Math.round(canvas.width / 25);
        ctx.font = 'bold ' + size + 'px sans-serif';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-30 * Math.PI / 180);
        ctx.fillText(textWM.value || 'ЗАЩИЩЕНО', 0, 0);
        ctx.restore();
    }

    downBtn.addEventListener('click', function() {
        if (!img) return;
        var link = document.createElement('a');
        link.download = 'protected.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>
</body>
</html>
